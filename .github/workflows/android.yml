name: Android RC — gate de release

# Este workflow deixou de "gerar um APK" e passou a ser o gate.
# Nada aqui publica artefato se um passo anterior falhar: se o typecheck, o
# build ou o Gradle quebrarem, o job morre e não existe APK para baixar. Um
# artefato que sai de um build vermelho é pior que nenhum artefato.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm ci

      # ---- Gates de código. Ordem importa: o barato falha primeiro. ----
      - name: Testes
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build web
        run: npm run build

      # Lint é informativo por enquanto: a base tem formatação herdada do
      # shadcn que não vale uma refatoração. O que não pode passar é erro
      # novo — por isso o resultado fica visível no log, sem derrubar o gate.
      - name: Lint (informativo)
        run: npm run lint || echo "LINT_WARNINGS=1 >> ver log acima"
        continue-on-error: true

      # ---- Verificações de release ----
      - name: Conferir configuração Android
        run: |
          set -e
          echo "== SDK =="
          grep -E "minSdkVersion|compileSdkVersion|targetSdkVersion" android/variables.gradle
          echo "== app =="
          grep -E "applicationId|versionCode|versionName" android/app/build.gradle
          TARGET=$(grep -oP 'targetSdkVersion\s*=\s*\K\d+' android/variables.gradle)
          if [ "$TARGET" -lt 35 ]; then
            echo "targetSdk $TARGET abaixo do exigido pela Play"; exit 1
          fi
          PKG=$(grep -oP 'applicationId\s*"\K[^"]+' android/app/build.gradle)
          if [ "$PKG" != "com.motoanjo.app" ]; then
            echo "package id mudou: $PKG"; exit 1
          fi

      - name: Nenhum segredo no repositório
        run: |
          set -e
          if grep -rnoE "AIza[0-9A-Za-z_-]{20,}|sb_secret_[A-Za-z0-9]+|EAA[A-Za-z0-9]{30,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}" \
              --include="*.ts" --include="*.tsx" --include="*.sql" --include="*.json" \
              --include="*.gradle" --include="*.xml" --include="*.yml" . ; then
            echo "possível segredo commitado"; exit 1
          fi
          echo "nenhum segredo encontrado"

      - name: Migrations presentes e ordenadas
        run: |
          set -e
          COUNT=$(ls supabase/migrations/*.sql | wc -l)
          echo "migrations: $COUNT"
          if [ "$COUNT" -lt 30 ]; then echo "migrations sumiram"; exit 1; fi
          # A ordem cronológica dos nomes tem de bater com a ordem de aplicação.
          diff <(ls supabase/migrations/*.sql) <(ls supabase/migrations/*.sql | sort) \
            || { echo "nomes fora de ordem"; exit 1; }

      # ---- Android ----
      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Manifest merge e checks do Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:processDebugMainManifest --stacktrace

      - name: Montar APK debug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Metadados e SHA-256
        id: meta
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "APK não foi gerado"; exit 1; }
          echo "sha256: $(sha256sum $APK | cut -d' ' -f1)"
          echo "tamanho: $(du -h $APK | cut -f1)"
          {
            echo "commit: ${{ github.sha }}"
            echo "sha256: $(sha256sum $APK | cut -d' ' -f1)"
            grep -E "versionCode|versionName" android/app/build.gradle
            grep -E "minSdkVersion|targetSdkVersion" android/variables.gradle
          } > android-build-metadata.txt

      # `if: success()` explícito: sem isso um passo anterior vermelho ainda
      # deixaria um APK para baixar, e alguém instalaria achando que passou.
      - name: Publicar artefato
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: moto-anjo-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-build-metadata.txt
          retention-days: 14
