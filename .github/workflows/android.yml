name: Android RC — gate de release

# Este workflow deixou de "gerar um APK" e passou a ser o gate.
# Nada aqui publica artefato se um passo anterior falhar: se o typecheck, o
# build ou o Gradle quebrarem, o job morre e não existe APK para baixar. Um
# artefato que sai de um build vermelho é pior que nenhum artefato.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build web
        run: npm run build

      - name: Lint global (informativo — não bloqueia)
        run: |
          npm run lint > /tmp/lint.txt 2>&1 || true
          TOTAL=$(grep -cE "error|warning" /tmp/lint.txt || true)
          echo "problemas de lint na base inteira: $TOTAL (histórico, não bloqueia)"
          tail -40 /tmp/lint.txt
        continue-on-error: true

      - name: Lint dos arquivos alterados (bloqueia)
        run: |
          set -e
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "sem base de comparação (primeiro push ou force-push) — nada a lintar"
            exit 0
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "commit base indisponível no checkout — nada a lintar"
            exit 0
          fi
          mapfile -d '' ALTERADOS < <(git diff --name-only -z --diff-filter=ACMR "$BASE" HEAD -- '*.ts' '*.tsx'             | grep -zv '^src/integrations/supabase/types\.ts$' || true)
          if [ "${#ALTERADOS[@]}" -eq 0 ]; then
            echo "nenhum arquivo TS/TSX alterado neste push"
            exit 0
          fi
          printf 'lintando apenas: %s\n' "${ALTERADOS[*]}"
          npx eslint "${ALTERADOS[@]}"

      - name: Conferir configuração Android
        run: |
          set -e
          echo "== SDK =="
          grep -E "minSdkVersion|compileSdkVersion|targetSdkVersion" android/variables.gradle
          echo "== app =="
          grep -E "applicationId|versionCode|versionName" android/app/build.gradle
          TARGET=$(grep -oP 'targetSdkVersion\s*=\s*\K\d+' android/variables.gradle)
          if [ "$TARGET" -lt 36 ]; then
            echo "targetSdk $TARGET abaixo do exigido para novos apps na Play em 31/08/2026"; exit 1
          fi
          PKG=$(grep -oP 'applicationId\s*"\K[^"]+' android/app/build.gradle)
          if [ "$PKG" != "com.motoanjo.app" ]; then
            echo "package id mudou: $PKG"; exit 1
          fi

      - name: Nenhum segredo no repositório
        run: |
          set -e
          PADRAO='sb_secret_[A-Za-z0-9]+|EAA[A-Za-z0-9]{30,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}'
          git rev-parse --is-inside-work-tree > /dev/null
          ACHADOS=$(git ls-files -z | xargs -0 -r grep -lIE "$PADRAO" 2>/dev/null || true)
          ACHADOS=$(echo "$ACHADOS" | grep -vE '^(.env.example|RC[0-9].*.patch)$' || true)
          if [ -n "$ACHADOS" ]; then
            echo "possível segredo em arquivo versionado (valor não impresso de propósito):"
            echo "$ACHADOS"
            exit 1
          fi
          echo "nenhum segredo em arquivo versionado"

      - name: Migrations presentes, ordenadas e com versão única
        run: |
          set -e
          mapfile -t MIGRATIONS < <(printf '%s\n' supabase/migrations/*.sql)
          COUNT=${#MIGRATIONS[@]}
          echo "migrations: $COUNT"
          if [ "$COUNT" -lt 30 ]; then echo "migrations sumiram"; exit 1; fi
          diff <(printf '%s\n' "${MIGRATIONS[@]}") <(printf '%s\n' "${MIGRATIONS[@]}" | sort) \
            || { echo "nomes fora de ordem"; exit 1; }

          VERSOES=$(printf '%s\n' "${MIGRATIONS[@]}" | sed -E 's#^.*/([0-9]{14})_.*#\1#')
          DUPLICADAS=$(printf '%s\n' "$VERSOES" | sort | uniq -d)
          if [ -n "$DUPLICADAS" ]; then
            echo "timestamps de migration duplicados:"
            echo "$DUPLICADAS"
            exit 1
          fi
          echo "timestamps de migration únicos"

      - name: Declarar o frontend que o APK vai carregar
        run: |
          set -e
          URL="${MOTOANJO_WEB_URL:-https://motoanjo.app.br}"
          echo "APK_WEB_URL=$URL" >> "$GITHUB_ENV"
          echo "::notice title=Frontend do APK::Este APK carrega $URL (server.url). Ele NAO embute o frontend deste commit; a tela so mostra este codigo depois que essa URL for publicada."
        env:
          MOTOANJO_WEB_URL: ${{ vars.MOTOANJO_WEB_URL }}

      - name: Sincronizar Capacitor
        run: npx cap sync android
        env:
          MOTOANJO_WEB_URL: ${{ vars.MOTOANJO_WEB_URL }}

      - name: Manifest merge e checks do Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:processDebugMainManifest --stacktrace

      - name: Montar APK debug
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest assembleDebug --stacktrace

      - name: Montar APK + AAB de teste (chave temporária)
        working-directory: android
        run: |
          set -euo pipefail
          mkdir -p app
          keytool -genkeypair -v \
            -keystore app/rc-release.jks \
            -storepass motoanjo-rc \
            -keypass motoanjo-rc \
            -alias motoanjo-rc \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Moto Anjo RC, OU=Release Candidate, O=Moto Anjo"
          export MOTOANJO_KEYSTORE_FILE=rc-release.jks
          export MOTOANJO_KEYSTORE_PASSWORD=motoanjo-rc
          export MOTOANJO_KEY_ALIAS=motoanjo-rc
          export MOTOANJO_KEY_PASSWORD=motoanjo-rc
          ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace
          test -f app/build/outputs/bundle/release/app-release.aab
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Metadados e SHA-256 do teste
        id: meta
        run: |
          set -e
          DEBUG=android/app/build/outputs/apk/debug/app-debug.apk
          RELEASE_APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)
          RELEASE_AAB=$(find android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -1)
          test -f "$DEBUG" && test -f "$RELEASE_APK" && test -f "$RELEASE_AAB" || { echo "artefato Android não foi gerado"; exit 1; }
          VCODE=$(grep -oE "versionCode +[0-9]+" android/app/build.gradle | grep -oE "[0-9]+")
          VNAME=$(grep -oE 'versionName +"[^"]+"' android/app/build.gradle | cut -d'"' -f2)
          test -n "$VCODE" && test -n "$VNAME" || { echo "versão não lida do build.gradle"; exit 1; }
          AAB="moto-anjo-${VNAME}-${VCODE}-rc-test.aab"
          APK="moto-anjo-${VNAME}-${VCODE}-rc-test.apk"
          DEBUG_APK="moto-anjo-${VNAME}-${VCODE}-debug.apk"
          cp "$RELEASE_AAB" "$AAB"
          cp "$RELEASE_APK" "$APK"
          cp "$DEBUG" "$DEBUG_APK"
          SIGNING="RC_TESTE (chave temporária; não publicar na Play)"
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256 AAB: $(sha256sum "$AAB" | cut -d' ' -f1)"
          echo "sha256 APK release: $(sha256sum "$APK" | cut -d' ' -f1)"
          {
            echo "arquivo AAB: $AAB"
            echo "arquivo APK release: $APK"
            echo "arquivo APK debug: $DEBUG_APK"
            echo "commit: ${{ github.sha }}"
            echo "sha256 AAB: $(sha256sum "$AAB" | cut -d' ' -f1)"
            echo "sha256 APK release: $(sha256sum "$APK" | cut -d' ' -f1)"
            echo "frontend carregado (server.url): $APK_WEB_URL"
            echo "frontend embutido no APK: NAO — ver capacitor.config.ts"
            echo "assinatura: $SIGNING"
            echo "versionCode: $VCODE"
            echo "versionName: $VNAME"
            grep -E "minSdkVersion|targetSdkVersion" android/variables.gradle
          } > android-build-metadata.txt
          cat android-build-metadata.txt

      - name: Publicar artefatos Android
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: moto-anjo-android-rc
          path: |
            ${{ steps.meta.outputs.aab }}
            ${{ steps.meta.outputs.apk }}
            moto-anjo-*-debug.apk
            android-build-metadata.txt
          retention-days: 14

  play_release:
    # Nunca executa para PR ou push. O ambiente deve exigir aprovação e
    # armazenar os quatro secrets de assinatura (sem cópia em repo secrets).
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: gate
    environment: play-release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Preparar web e Android do mesmo commit aprovado no gate
        run: |
          npm ci
          npm run build
          npx cap sync android
        env:
          MOTOANJO_WEB_URL: ${{ vars.MOTOANJO_WEB_URL }}

      - name: Assinar AAB e APK com chave Play protegida
        working-directory: android
        env:
          MOTOANJO_WEB_URL: ${{ vars.MOTOANJO_WEB_URL }}
          MOTOANJO_KEYSTORE_BASE64: ${{ secrets.MOTOANJO_KEYSTORE_BASE64 }}
          MOTOANJO_KEYSTORE_PASSWORD: ${{ secrets.MOTOANJO_KEYSTORE_PASSWORD }}
          MOTOANJO_KEY_ALIAS: ${{ secrets.MOTOANJO_KEY_ALIAS }}
          MOTOANJO_KEY_PASSWORD: ${{ secrets.MOTOANJO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MOTOANJO_KEYSTORE_BASE64:?Configure a keystore no ambiente play-release}"
          : "${MOTOANJO_KEYSTORE_PASSWORD:?Configure a senha no ambiente play-release}"
          : "${MOTOANJO_KEY_ALIAS:?Configure o alias no ambiente play-release}"
          : "${MOTOANJO_KEY_PASSWORD:?Configure a senha da chave no ambiente play-release}"
          chmod +x gradlew
          ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace
          AAB=app/build/outputs/bundle/release/app-release.aab
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$AAB" && test -f "$APK"
          jarsigner -verify "$AAB" | grep -q "jar verified."
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          {
            echo "status: PLAY_ASSINADO"
            echo "commit: ${{ github.sha }}"
            echo "url_do_frontend: ${MOTOANJO_WEB_URL:-https://motoanjo.app.br}"
            echo "sha256 AAB: $(sha256sum "$AAB" | cut -d' ' -f1)"
            echo "sha256 APK: $(sha256sum "$APK" | cut -d' ' -f1)"
          } > play-build-metadata.txt
          cat play-build-metadata.txt

      - name: Publicar artefatos assinados para revisão
        uses: actions/upload-artifact@v4
        with:
          name: moto-anjo-play-assinado
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
            android/play-build-metadata.txt
          retention-days: 14
