name: Android RC — gate de release

# Este workflow deixou de "gerar um APK" e passou a ser o gate.
# Nada aqui publica artefato se um passo anterior falhar: se o typecheck, o
# build ou o Gradle quebrarem, o job morre e não existe APK para baixar. Um
# artefato que sai de um build vermelho é pior que nenhum artefato.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # O lint incremental compara com o commit anterior. Com o padrão
          # (fetch-depth: 1) não existe base e `git diff` falharia.
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm ci

      # ---- Gates de código. Ordem importa: o barato falha primeiro. ----
      - name: Testes
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build web
        run: npm run build

      # Lint em duas camadas.
      #
      # O problema real não era o lint bloquear — ele nunca bloqueou (`|| echo`
      # E `continue-on-error`). O problema é o inverso: com centenas de erros
      # históricos de Prettier na base herdada do shadcn, um erro NOVO fica
      # invisível no meio do ruído, e ninguém lê um passo que sempre grita.
      #
      # Camada 1: o total histórico continua sem derrubar nada, mas agora sai
      # como número, que dá para acompanhar de um build para o outro.
      - name: Lint global (informativo — não bloqueia)
        run: |
          npm run lint > /tmp/lint.txt 2>&1 || true
          TOTAL=$(grep -cE "error|warning" /tmp/lint.txt || true)
          echo "problemas de lint na base inteira: $TOTAL (histórico, não bloqueia)"
          tail -40 /tmp/lint.txt
        continue-on-error: true

      # Camada 2: só o que ESTE push mudou. Arquivo histórico não entra, então
      # os erros antigos não bloqueiam nada; erro novo bloqueia, que é o único
      # jeito de a base parar de piorar. Conserto: `npx prettier --write <arquivo>`.
      - name: Lint dos arquivos alterados (bloqueia)
        run: |
          set -e
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "sem base de comparação (primeiro push ou force-push) — nada a lintar"
            exit 0
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "commit base indisponível no checkout — nada a lintar"
            exit 0
          fi
          # src/integrations/supabase/types.ts é 100% gerado pela plataforma
          # (sem script de geração no repo) e é reescrito sem formatação
          # Prettier a cada regeneração, o que recriava este gate a cada push.
          # Ele sai do conjunto bloqueante; o lint global informativo acima
          # continua cobrindo o arquivo. Código-fonte normal segue bloqueando.
          ALTERADOS=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.ts' '*.tsx' \
            | grep -v '^src/integrations/supabase/types\.ts$' | tr '\n' ' ' || true)
          if [ -z "$ALTERADOS" ]; then
            echo "nenhum arquivo TS/TSX alterado neste push"
            exit 0
          fi
          echo "lintando apenas: $ALTERADOS"
          npx eslint $ALTERADOS

      # ---- Verificações de release ----
      - name: Conferir configuração Android
        run: |
          set -e
          echo "== SDK =="
          grep -E "minSdkVersion|compileSdkVersion|targetSdkVersion" android/variables.gradle
          echo "== app =="
          grep -E "applicationId|versionCode|versionName" android/app/build.gradle
          TARGET=$(grep -oP 'targetSdkVersion\s*=\s*\K\d+' android/variables.gradle)
          if [ "$TARGET" -lt 35 ]; then
            echo "targetSdk $TARGET abaixo do exigido pela Play"; exit 1
          fi
          PKG=$(grep -oP 'applicationId\s*"\K[^"]+' android/app/build.gradle)
          if [ "$PKG" != "com.motoanjo.app" ]; then
            echo "package id mudou: $PKG"; exit 1
          fi

      # Este passo estava QUEBRADO e provado quebrado: a linha de continuação
      # `\` era seguida de uma linha só com espaços, então o comando terminava
      # ali. O shell executava `--include=*.ts` como se fosse um programa
      # ("command not found"), esse era o último status do `if`, e a condição
      # dava falso SEMPRE — o gate nunca reprovou nada. Pior: o primeiro grep
      # rodava mesmo assim, sobre o repositório inteiro, com `-o`, e IMPRIMIA
      # OS VALORES ENCONTRADOS no log do Actions.
      #
      # Agora: varre exatamente o que está versionado (`git ls-files`, que pega
      # arquivos sem extensão como `.env`, invisíveis para o filtro anterior) e
      # imprime SÓ O NOME DO ARQUIVO, nunca o trecho casado.
      - name: Nenhum segredo no repositório
        run: |
          set -e
          PADRAO='sb_secret_[A-Za-z0-9]+|EAA[A-Za-z0-9]{30,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}'
          # Sem esta guarda, um `git ls-files` que falhasse deixaria a lista
          # vazia e o gate passaria em silêncio — o defeito que estamos matando.
          git rev-parse --is-inside-work-tree > /dev/null
          ACHADOS=$(git ls-files -z | xargs -0 -r grep -lIE "$PADRAO" 2>/dev/null || true)
          # Arquivos de exemplo e patches de histórico usam chave de amostra.
          ACHADOS=$(echo "$ACHADOS" | grep -vE '^(\.env\.example|RC[0-9].*\.patch)$' || true)
          if [ -n "$ACHADOS" ]; then
            echo "possível segredo em arquivo versionado (valor não impresso de propósito):"
            echo "$ACHADOS"
            exit 1
          fi
          echo "nenhum segredo em arquivo versionado"

      - name: Migrations presentes e ordenadas
        run: |
          set -e
          COUNT=$(ls supabase/migrations/*.sql | wc -l)
          echo "migrations: $COUNT"
          if [ "$COUNT" -lt 30 ]; then echo "migrations sumiram"; exit 1; fi
          # A ordem cronológica dos nomes tem de bater com a ordem de aplicação.
          diff <(ls supabase/migrations/*.sql) <(ls supabase/migrations/*.sql | sort) \
            || { echo "nomes fora de ordem"; exit 1; }

      # ---- Android ----
      # Declara, no log e no artefato, EXATAMENTE qual frontend este APK vai
      # carregar. Sem isto, um APK verde pode estar abrindo uma publicação
      # antiga — e ninguém saberia olhando só o build.
      - name: Declarar o frontend que o APK vai carregar
        run: |
          set -e
          URL="${MOTOANJO_WEB_URL:-https://moto-angel-guardian.lovable.app}"
          echo "APK_WEB_URL=$URL" >> $GITHUB_ENV
          echo "::notice title=Frontend do APK::Este APK carrega $URL (server.url). Ele NAO embute o frontend deste commit; a tela so mostra este codigo depois que essa URL for publicada."
        env:
          MOTOANJO_WEB_URL: ${{ vars.MOTOANJO_WEB_URL }}

      - name: Sincronizar Capacitor
        run: npx cap sync android
        env:
          MOTOANJO_WEB_URL: ${{ vars.MOTOANJO_WEB_URL }}

      - name: Manifest merge e checks do Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:processDebugMainManifest --stacktrace

      - name: Montar APK debug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Metadados e SHA-256
        id: meta
        run: |
          set -e
          ORIGEM=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$ORIGEM" || { echo "APK não foi gerado"; exit 1; }
          # O nome sai do build.gradle, nunca de constante no YAML: era assim
          # que o outro workflow publicava "v3 / 1.2" enquanto o projeto já
          # estava em outra versão.
          VCODE=$(grep -oE "versionCode +[0-9]+" android/app/build.gradle | grep -oE "[0-9]+")
          VNAME=$(grep -oE 'versionName +"[^"]+"' android/app/build.gradle | cut -d'"' -f2)
          test -n "$VCODE" && test -n "$VNAME" || { echo "versão não lida do build.gradle"; exit 1; }
          APK="moto-anjo-${VNAME}-${VCODE}-debug.apk"
          cp "$ORIGEM" "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256: $(sha256sum $APK | cut -d' ' -f1)"
          echo "tamanho: $(du -h $APK | cut -f1)"
          {
            echo "arquivo: $APK"
            echo "commit: ${{ github.sha }}"
            echo "sha256: $(sha256sum $APK | cut -d' ' -f1)"
            echo "frontend carregado (server.url): $APK_WEB_URL"
            echo "frontend embutido no APK: NAO — ver capacitor.config.ts"
            grep -E "versionCode|versionName" android/app/build.gradle
            grep -E "minSdkVersion|targetSdkVersion" android/variables.gradle
          } > android-build-metadata.txt
          cat android-build-metadata.txt

      # `if: success()` explícito: sem isso um passo anterior vermelho ainda
      # deixaria um APK para baixar, e alguém instalaria achando que passou.
      - name: Publicar artefato
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: moto-anjo-android-debug
          path: |
            ${{ steps.meta.outputs.apk }}
            android-build-metadata.txt
          retention-days: 14

