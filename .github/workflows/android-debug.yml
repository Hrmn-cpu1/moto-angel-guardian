name: Android Debug APK (v3)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-debug.yml"

jobs:
  build-apk:
    name: Build app-debug.apk
    runs-on: ubuntu-latest
    # Qualquer passo que falhar interrompe o job (comportamento padrao do runner).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build web
        run: npm run build

      - name: Ensure Android assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Capacitor sync (android)
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Gradle assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK metadata (tamanho + SHA-256)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          echo "### APK v3" >> "$GITHUB_STEP_SUMMARY"
          echo "- applicationId: com.motoanjo.app" >> "$GITHUB_STEP_SUMMARY"
          echo "- versionCode: 3 / versionName: 1.2" >> "$GITHUB_STEP_SUMMARY"
          echo "- tamanho: $(stat -c%s "$APK") bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha256: $(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$APK"
          ls -l "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moto-anjo-debug-v3
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30